server.port=8080
spring.application.name=CineLog-Plus

# Database Configuration - IMPORTANT: SSL and Connection Pool
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&sslrootcert=system
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (prevents connection issues)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


# JWT Configuration
jwt.secret=${JWT_SECRET}
vidsrc.key=${VIDSRC_KEY}
tmdb.api.key=${TMDB_API_KEY}

# CORS Configuration (update with your Netlify URL later)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://venerable-puffpuff-bb8dcc.netlify.app}

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.Zenith=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG